<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>내일을 찾아서</title>
<link rel="stylesheet" href="css/base.css" />
<link rel="stylesheet" href="css/story.css" />
</head>
<body class="story-body">
  <audio id="bgm-dark" src="assets/audio/story-dark.mp3" loop preload="auto"></audio>
  <div class="sun-reveal-overlay" id="sun-reveal"></div>
  <div class="cicada-layer" id="cicada">맴——————　맴——————　맴——————</div>

  <div class="app">
    <div class="nick-header" id="nick-header"></div>

    <div class="story-top">
      <div class="story-clock" id="story-clock">오전 8:20</div>
      <div style="display:flex; gap:8px;">
        <button class="story-notebook-btn" id="bgm-toggle" title="배경음악 켜기/끄기">🔊</button>
        <button class="story-notebook-btn" id="story-reset-btn">↺ 처음부터</button>
        <button class="story-notebook-btn" id="notebook-open">📓 수첩 (<span id="notebook-count">0</span>)</button>
      </div>
    </div>

    <div id="story-root"></div>
  </div>

  <div class="notebook-panel" id="notebook-panel" hidden>
    <div class="app" style="padding:0;">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:16px;">
        <h2 class="title">📓 단서 수첩</h2>
        <button class="btn btn-ghost" id="notebook-close">닫기</button>
      </div>
      <div id="notebook-list"></div>
    </div>
  </div>

  <script type="module" src="js/story.js"></script>
</body>
</html>
